services:
  postgres:
    image: 'postgres:17'
    container_name: 'my_postgres'
    environment:
      POSTGRES_DB: mybank
      POSTGRES_PASSWORD: 12345
      POSTGRES_USER: myuser
    ports:
      - 5432:5432
    volumes:
      - ./config/postgres:/docker-entrypoint-initdb.d
#      - ./volume/postgress_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mybank" ]
      interval: 5s
      retries: 5
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.3'
    container_name: 'my_keycloak'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mybank
      KC_DB_USERNAME: myuser
      KC_DB_PASSWORD: 12345
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_IMPORT: /opt/keycloak/config/realm-export.json
    ports:
      - 8080:8080
    command: start-dev --import-realm
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
#      - ./volume/keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
  myapp:
    container_name: bankapps
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mybank
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: 12345
      TZ: Asia/Jakarta
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - 8081:8081
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
